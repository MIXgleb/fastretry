[project]
name = "retry"
version = "0.1.0"
description = ""
requires-python = ">=3.14"
authors = [{ name = "Gleb Mikhalev", email = "gleb1@bk.ru" }]
dependencies = []


# Ruff config: https://docs.astral.sh/ruff/settings
[tool.ruff]
line-length = 100
target-version = "py314"
include = ["retry/**/*.py"]


[tool.ruff.format]
preview = true
quote-style = "double"
docstring-code-format = true


[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    "incorrect-blank-line-before-class",
    "multi-line-summary-first-line",
    "missing-trailing-comma",
    "missing-copyright-notice",
]


# Mypy config: https://mypy.readthedocs.io/en/stable/index.html
[tool.mypy]
python_version = "3.14"
strict = true
files = ["retry"]

warn_unreachable = true
warn_no_return = true
warn_unused_configs = true
strict_equality = true
extra_checks = true
warn_return_any = true
warn_unused_ignores = true

show_error_codes = true
show_error_context = true
pretty = true

enable_error_code = [
    "unused-awaitable",
    "ignore-without-code",
    "truthy-bool",
    "mutable-override",
    "unimported-reveal",
    "truthy-bool",
]


# Ty config: https://docs.astral.sh/ty/
[tool.ty.environment]
python-version = "3.14"


[tool.ty.src]
include = ["retry"]


[tool.ty.rules]
all = "error"


# Pyrefly config: https://pyrefly.org/
[tool.pyrefly]
python-version = "3.14"
preset = "strict"
project-includes = ["retry"]
