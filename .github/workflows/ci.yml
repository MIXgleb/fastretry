name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Format check (ruff)
        run: uv run ruff format --check

      - name: Lint (ruff)
        run: uv run ruff check

      - name: Type check (mypy)
        run: uv run mypy

      - name: Type check (pyrefly)
        run: uv run pyrefly check

      - name: Run tests
        run: uv run pytest

  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Build documentation
        run: uv run --locked --no-default-groups --group docs sphinx-build -W --keep-going -b html docs/source docs/build/html
