[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fastretry"]


# Project
[project]
name = "fastretry"
version = "0.5.1"
description = "Retry decorator for synchronous and asynchronous functions."
authors = [{ name = "Gleb Mikhalev", email = "gleb1@bk.ru" }]
requires-python = ">=3.13"

dependencies = ["typing_extensions>=4.11; python_version < '3.15'"]

readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]


[project.urls]
"Homepage" = "https://github.com/MIXgleb/fastretry"
"Bug Tracker" = "https://github.com/MIXgleb/fastretry/issues"
"Changelog" = "https://github.com/MIXgleb/fastretry/blob/main/CHANGELOG.md"
"Source" = "https://github.com/MIXgleb/fastretry"


[dependency-groups]
dev = [
    "covdefaults>=2.3.0",
    "mypy>=2.4.0",
    "pyrefly>=1.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.16.0",
    "pytest-randomly>=5.0.0",
    "ruff>=0.17.1",
    "twine>=7.0.0",
]
docs = [
    "sphinx",
    "sphinx-autodoc-typehints",
    "sphinxcontrib-mermaid",
    "furo",
    "added-value",
    "tomli",
    "myst-parser",
]


# Uv: https://docs.astral.sh/uv/
[tool.uv]
default-groups = ["dev"]


# Ruff: https://docs.astral.sh/ruff/settings
[tool.ruff]
line-length = 100
target-version = "py313"


[tool.ruff.format]
preview = true
quote-style = "double"
docstring-code-format = true


[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    "incorrect-blank-line-before-class",
    "multi-line-summary-first-line",
    "missing-trailing-comma",
    "missing-copyright-notice",
]


[tool.ruff.lint.per-file-ignores]
"tests/**.py" = [
    "import-private-name",
    "undocumented-public-function",
    "undocumented-public-method",
    "undocumented-public-class",
    "too-many-arguments",
    "too-many-positional-arguments",
    "boolean-type-hint-positional-argument",
    "boolean-default-value-positional-argument",
    "assert",
    "magic-value-comparison",
    "unused-async",
    "private-member-access",
]


# Mypy: https://mypy.readthedocs.io/en/stable/index.html
[tool.mypy]
python_version = "3.13"
strict = true
files = ["fastretry"]

warn_unreachable = true
warn_no_return = true
warn_unused_configs = true
strict_equality = true
extra_checks = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
local_partial_types = true

show_error_codes = true
show_error_context = true
pretty = true

enable_error_code = [
    "unused-awaitable",
    "ignore-without-code",
    "truthy-bool",
    "mutable-override",
    "unimported-reveal",
    "truthy-bool",
    "truthy-iterable",
    "redundant-expr",
    "possibly-undefined",
    "redundant-self",
    "explicit-override",
    "unimported-reveal",
    "deprecated",
]


# Ty: https://docs.astral.sh/ty/
[tool.ty.environment]
python-version = "3.13"


[tool.ty.src]
include = ["fastretry"]


[tool.ty.rules]
all = "error"


# Pyrefly: https://pyrefly.org/
[tool.pyrefly]
python-version = "3.13"
preset = "strict"
project-includes = ["fastretry"]


# Pytest: http://doc.pytest.org/en/latest/customize.html
[tool.pytest.ini_options]
asyncio_mode = "auto"
xfail_strict = true
filterwarnings = ["error"]
testpaths = ["tests"]
addopts = [
    "--cov=fastretry",
    "--cov=tests",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-fail-under=100",
    "--strict-markers",
    "--strict-config",
    "--doctest-modules",
]


# Coverage: https://coverage.readthedocs.io/
[tool.coverage.run]
plugins = ["covdefaults"]
