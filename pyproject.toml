[project]
name = "retry"
version = "0.2.0"
description = "Retry decorator for synchronous and asynchronous functions."
requires-python = ">=3.12"
authors = [{ name = "Gleb Mikhalev", email = "gleb1@bk.ru" }]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "ty",
    "pyrefly",
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "pytest-asyncio",
    "pytest-randomly",
]
docs = ["sphinx>=7.2.6", "furo"]


# Ruff config: https://docs.astral.sh/ruff/settings
[tool.ruff]
line-length = 100
target-version = "py312"


[tool.ruff.format]
preview = true
quote-style = "double"
docstring-code-format = true


[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    "incorrect-blank-line-before-class",
    "multi-line-summary-first-line",
    "missing-trailing-comma",
    "missing-copyright-notice",
]


[tool.ruff.lint.per-file-ignores]
"tests/**.py" = [
    "import-private-name",
    "undocumented-public-function",
    "undocumented-public-method",
    "undocumented-public-class",
    "too-many-arguments",
    "too-many-positional-arguments",
    "boolean-type-hint-positional-argument",
    "boolean-default-value-positional-argument",
    "assert",
    "magic-value-comparison",
    "unused-async",
    "private-member-access",
]


# Mypy config: https://mypy.readthedocs.io/en/stable/index.html
[tool.mypy]
python_version = "3.12"
strict = true
files = ["retry"]

warn_unreachable = true
warn_no_return = true
warn_unused_configs = true
strict_equality = true
extra_checks = true
warn_return_any = true
warn_unused_ignores = true

show_error_codes = true
show_error_context = true
pretty = true

enable_error_code = [
    "unused-awaitable",
    "ignore-without-code",
    "truthy-bool",
    "mutable-override",
    "unimported-reveal",
    "truthy-bool",
]


# Ty config: https://docs.astral.sh/ty/
[tool.ty.environment]
python-version = "3.12"


[tool.ty.src]
include = ["retry"]


[tool.ty.rules]
all = "error"


# Pyrefly config: https://pyrefly.org/
[tool.pyrefly]
python-version = "3.12"
preset = "strict"
project-includes = ["retry"]


# Pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "--cov=retry",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=100",
    "--strict-markers",
    "--strict-config",
]
